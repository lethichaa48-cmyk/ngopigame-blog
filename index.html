<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Autoblog — artikel teknologi & game Android terbaru, ditulis AI setiap hari.">
  <meta name="theme-color" content="#0B0B0F">
  <title>Autoblog — Teknologi &amp; Game Android</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ================= DESIGN TOKENS ================= */
    :root {
      --accent: #6D5AE6;
      --accent-2: #F97316;
      --accent-grad: linear-gradient(135deg, #6D5AE6 0%, #F97316 100%);
      --font-ui: 'Inter', system-ui, sans-serif;
      --font-quote: 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 16px;
      --maxw: 720px;
      --space: 24px;
    }
    html[data-theme="dark"] {
      --bg: #0B0B0F;
      --bg-soft: #131318;
      --card: #16161D;
      --card-hover: #1B1B24;
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.16);
      --fg: #F2F2F5;
      --fg-muted: #9A9AA5;
      --fg-faint: #6B6B76;
      --glass: rgba(18,18,24,.72);
      --shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    html[data-theme="light"] {
      --bg: #FAFAFB;
      --bg-soft: #F0F0F4;
      --card: #FFFFFF;
      --card-hover: #F7F7FA;
      --border: rgba(0,0,0,.08);
      --border-strong: rgba(0,0,0,.14);
      --fg: #16161A;
      --fg-muted: #55555F;
      --fg-faint: #8A8A94;
      --glass: rgba(255,255,255,.75);
      --shadow: 0 20px 60px rgba(0,0,0,.08);
    }

    /* ================= BASE ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.7;
      color: var(--fg);
      background: var(--bg);
      transition: background .4s ease, color .4s ease;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* gradient blob background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(600px 400px at 85% -5%, rgba(109,90,230,.14), transparent 60%),
        radial-gradient(500px 350px at -10% 15%, rgba(249,115,22,.10), transparent 60%);
      pointer-events: none;
    }
    ::selection { background: var(--accent); color: #fff; }
    a { color: inherit; }

    /* ================= HEADER ================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
    }
    .site-header .inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 14px var(--space);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .logo {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: var(--accent-grad);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(109,90,230,.4);
    }
    .brand small {
      font-weight: 500;
      font-size: .7rem;
      color: var(--fg-faint);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-left: -4px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .count-pill {
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 500;
      color: var(--accent);
      border: 1px solid var(--border-strong);
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--bg-soft);
      white-space: nowrap;
    }
    /* theme toggle */
    .theme-toggle {
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg-soft);
      color: var(--fg);
      font-size: 17px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .25s cubic-bezier(.4,0,.2,1), background .25s, border-color .25s;
    }
    .theme-toggle:hover { transform: rotate(20deg) scale(1.05); border-color: var(--accent); }
    .theme-toggle:active { transform: scale(.92); }

    /* ================= HERO ================= */
    .hero {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 64px var(--space) 24px;
    }
    .hero .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: .72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--accent);
      border: 1px solid var(--border-strong);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--bg-soft);
      margin-bottom: 20px;
    }
    .hero .kicker .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.7); }
    }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.08;
      margin-bottom: 16px;
    }
    .hero h1 .grad {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      color: var(--fg-muted);
      font-size: 1.08rem;
      max-width: 520px;
    }

    /* ================= FEED ================= */
    .feed-wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 32px var(--space) 80px;
    }
    .feed-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: .74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--fg-faint);
      margin-bottom: 18px;
    }
    .feed-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      margin-left: 16px;
    }
    .post {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s, border-color .25s, background .25s;
      position: relative;
      overflow: hidden;
    }
    .post::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent-grad);
      opacity: 0;
      transition: opacity .25s;
    }
    .post:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--border-strong);
      background: var(--card-hover);
    }
    .post:hover::before { opacity: 1; }
    .post .thumb {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 16px;
      background: var(--bg-soft);
      transition: transform .4s ease;
    }
    .post:hover .thumb { transform: scale(1.01); }
    .post .date {
      font-family: var(--font-mono);
      font-size: .7rem;
      font-weight: 500;
      color: var(--fg-faint);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 8px;
    }
    .post h2 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 8px;
      transition: color .2s;
    }
    .post:hover h2 { color: var(--accent); }
    .post .excerpt {
      font-size: .92rem;
      color: var(--fg-muted);
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .post .more {
      font-size: .84rem;
      font-weight: 600;
      color: var(--accent);
    }
    .post .more::after { content: " →"; transition: margin-left .2s; }
    .post:hover .more::after { margin-left: 4px; }

    /* ================= ARTICLE ================= */
    .article {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 40px var(--space) 90px;
    }
    .article .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      font-weight: 500;
      color: var(--fg-muted);
      text-decoration: none;
      margin-bottom: 28px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-soft);
      transition: border-color .2s, color .2s;
    }
    .article .back:hover { border-color: var(--accent); color: var(--fg); }
    .article h1 {
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .article .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-family: var(--font-mono);
      font-size: .74rem;
      color: var(--fg-faint);
      margin-bottom: 32px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .article .meta .tag {
      color: var(--accent);
      border: 1px solid var(--border-strong);
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--bg-soft);
    }
    .article .content {
      font-size: 1.06rem;
      line-height: 1.85;
      color: var(--fg);
    }
    .article .content figure {
      margin: 0 0 28px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .article .content figure img {
      width: 100%; height: auto;
      display: block;
    }
    .article .content h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 40px 0 14px;
      line-height: 1.3;
    }
    .article .content h3 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 28px 0 10px;
    }
    .article .content p { margin-bottom: 20px; }
    .article .content p:first-of-type::first-letter {
      font-family: var(--font-quote);
      font-size: 3.4em;
      font-weight: 600;
      float: left;
      line-height: .85;
      margin: 4px 10px 0 0;
      color: var(--accent);
    }
    .article .content ul, .article .content ol {
      margin: 0 0 20px 26px;
    }
    .article .content li { margin-bottom: 10px; }
    .article .content strong { font-weight: 700; color: var(--fg); }
    .article .content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .article .content blockquote {
      font-family: var(--font-quote);
      font-style: italic;
      font-size: 1.35em;
      line-height: 1.5;
      color: var(--fg);
      border-left: 3px solid var(--accent);
      padding: 8px 0 8px 22px;
      margin: 32px 0;
    }

    /* ================= FOOTER ================= */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 28px var(--space);
      text-align: center;
      font-size: .8rem;
      color: var(--fg-faint);
    }
    .site-footer .mono { font-family: var(--font-mono); font-size: .74rem; }

    /* ================= STATES ================= */
    .loading, .empty {
      text-align: center;
      padding: 70px 20px;
      color: var(--fg-faint);
    }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 480px) {
      :root { --space: 18px; }
      .post h2 { font-size: 1.15rem; }
      .hero { padding-top: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .spinner { animation-duration: 1.6s; }
      .post, .post h2, .theme-toggle { transition: none; }
      .hero .kicker .dot { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">
        <span class="logo">✦</span>
        Autoblog
        <small>Teknologi</small>
      </a>
      <div class="header-right">
        <span class="count-pill" id="countPill">…</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema" title="Ganti tema siang/malam">🌙</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="kicker"><span class="dot"></span>Kurasi harian oleh AI</div>
      <h1>Teknologi &amp; game Android,<br><span class="grad">ditulis tiap hari.</span></h1>
      <p>Setiap artikel diriset dan ditulis otomatis dari berita terkini — baca, pahami, dan bagikan.</p>
    </section>

    <section class="feed-wrap">
      <div class="feed-label" id="feedLabel">Artikel terbaru</div>
      <div id="feed"><div class="loading"><div class="spinner"></div>Memuat artikel…</div></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Autoblog · digerakkan AI<br><span class="mono">ngopigame-blog.vercel.app</span></p>
  </footer>

  <script>
    // ===== Theme toggle (siang/malam manual, tersimpan) =====
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('autoblog-theme');
    if (saved) root.setAttribute('data-theme', saved);
    else root.setAttribute('data-theme', 'dark');
    updateToggleIcon();

    toggle.addEventListener('click', () => {
      const cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', cur);
      localStorage.setItem('autoblog-theme', cur);
      updateToggleIcon();
    });
    function updateToggleIcon() {
      const dark = root.getAttribute('data-theme') === 'dark';
      toggle.textContent = dark ? '☀️' : '🌙';
    }

    // ===== Feed =====
    const feed = document.getElementById('feed');
    const pill = document.getElementById('countPill');
    const label = document.getElementById('feedLabel');

    function fmtDate(s) {
      try {
        return new Date(s.replace(' ', 'T')).toLocaleDateString('id-ID', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
      } catch (e) { return s; }
    }

    function renderList(posts) {
      if (!posts.length) {
        feed.innerHTML = '<div class="empty">Belum ada artikel — artikel pertama sedang disiapkan ✦</div>';
        pill.textContent = '0';
        return;
      }
      pill.textContent = posts.length + ' artikel';
      label.textContent = 'Artikel terbaru (' + posts.length + ')';
      feed.innerHTML = posts.map((p, i) => {
        const d = fmtDate(p.date);
        const thumb = p.image
          ? '<img class="thumb" src="' + p.image + '" alt="" loading="lazy">'
          : '';
        return '<a class="post" href="/posts/' + encodeURIComponent(p.slug) + '.html">' +
          thumb +
          '<div class="date">' + d + '</div>' +
          '<h2>' + p.title + '</h2>' +
          '<p class="excerpt">' + p.excerpt + '</p>' +
          '<span class="more">Baca artikel</span>' +
        '</a>';
      }).join('');
    }

    fetch('/posts.json?' + new Date().getTime())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(renderList)
      .catch(e => {
        feed.innerHTML = '<div class="empty">⚠️ Gagal memuat artikel.<br><small>' + e.message + '</small></div>';
        pill.textContent = '?';
      });
  </script>
</body>
</html>
