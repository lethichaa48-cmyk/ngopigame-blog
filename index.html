<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Autoblog — artikel teknologi & game Android terbaru, ditulis AI setiap hari.">
  <meta name="theme-color" content="#ffffff">
  <title>Autoblog — Teknologi & Game Android</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============ DESIGN TOKENS ============ */
    :root {
      --color-primary: #DC2626;
      --color-on-primary: #FFFFFF;
      --color-accent: #1E40AF;
      --color-bg: #FFFFFF;
      --color-fg: #1A1A1A;
      --color-muted: #F5F5F4;
      --color-muted-fg: #6B7280;
      --color-border: #E5E5E5;
      --color-card: #FFFFFF;
      --font-head: 'Newsreader', Georgia, serif;
      --font-body: 'Roboto', -apple-system, sans-serif;
      --maxw: 680px;
      --space: 24px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0F0F0F;
        --color-fg: #F5F5F4;
        --color-muted: #1C1C1C;
        --color-muted-fg: #A3A3A3;
        --color-border: #2A2A2A;
        --color-card: #181818;
      }
    }

    /* ============ BASE ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.7;
      color: var(--color-fg);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }

    /* ============ HEADER ============ */
    .site-header {
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--color-bg) 85%, transparent);
    }
    .site-header .inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 14px var(--space);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-family: var(--font-head);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--color-fg);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      flex-shrink: 0;
    }
    .brand small {
      font-family: var(--font-body);
      font-size: .7rem;
      font-weight: 400;
      color: var(--color-muted-fg);
      letter-spacing: 0;
    }
    .count-pill {
      font-size: .75rem;
      font-weight: 500;
      color: var(--color-primary);
      border: 1px solid var(--color-border);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* ============ HERO ============ */
    .hero {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 48px var(--space) 8px;
    }
    .hero .kicker {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--color-primary);
      margin-bottom: 12px;
    }
    .hero h1 {
      font-family: var(--font-head);
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .hero p {
      color: var(--color-muted-fg);
      font-size: 1.02rem;
      max-width: 520px;
    }

    /* ============ FEED ============ */
    .feed-wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 24px var(--space) 60px;
    }
    .feed-label {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--color-muted-fg);
      margin-bottom: 16px;
    }
    .post {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 22px 0;
      border-bottom: 1px solid var(--color-border);
      transition: background .2s ease, padding .2s ease;
      border-radius: 8px;
    }
    .post:hover {
      background: var(--color-muted);
      padding-left: 16px;
      padding-right: 16px;
    }
    .post .date {
      font-size: .78rem;
      font-weight: 500;
      color: var(--color-muted-fg);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    .post h2 {
      font-family: var(--font-head);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      color: var(--color-fg);
      transition: color .2s ease;
    }
    .post:hover h2 { color: var(--color-primary); }
    .post .excerpt {
      font-size: .92rem;
      color: var(--color-muted-fg);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .post .more {
      display: inline-block;
      margin-top: 10px;
      font-size: .85rem;
      font-weight: 500;
      color: var(--color-accent);
    }
    .post .more::after { content: " →"; }

    /* ============ ARTICLE PAGE ============ */
    .article {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 40px var(--space) 80px;
    }
    .article .back {
      display: inline-block;
      font-size: .85rem;
      color: var(--color-muted-fg);
      text-decoration: none;
      margin-bottom: 24px;
    }
    .article .back:hover { color: var(--color-primary); }
    .article h1 {
      font-family: var(--font-head);
      font-size: clamp(1.7rem, 4.5vw, 2.4rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    .article .meta {
      font-size: .8rem;
      color: var(--color-muted-fg);
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
    }
    .article .content {
      font-family: var(--font-body);
      font-size: 1.05rem;
      line-height: 1.85;
    }
    .article .content h2 {
      font-family: var(--font-head);
      font-size: 1.45rem;
      font-weight: 600;
      margin: 32px 0 12px;
      letter-spacing: -0.01em;
    }
    .article .content h3 {
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 600;
      margin: 24px 0 10px;
    }
    .article .content p { margin-bottom: 18px; }
    .article .content ul, .article .content ol {
      margin: 0 0 18px 24px;
    }
    .article .content li { margin-bottom: 8px; }
    .article .content strong { font-weight: 700; }
    .article .content a { color: var(--color-accent); }

    /* ============ FOOTER ============ */
    .site-footer {
      border-top: 1px solid var(--color-border);
      padding: 24px var(--space);
      text-align: center;
      font-size: .8rem;
      color: var(--color-muted-fg);
    }
    .site-footer a { color: var(--color-muted-fg); }
    .site-footer a:hover { color: var(--color-primary); }

    /* ============ STATE ============ */
    .loading, .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-muted-fg);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 480px) {
      :root { --space: 20px; }
      .post h2 { font-size: 1.15rem; }
      .count-pill { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .spinner { animation-duration: 1.6s; }
      .post, .post h2 { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/">
        <span class="mark">✦</span>
        Autoblog
        <small>teknologi &amp; game</small>
      </a>
      <span class="count-pill" id="countPill">…</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="kicker">Kurasi harian oleh AI</div>
      <h1>Artikel teknologi &amp; game Android terbaru</h1>
      <p>Setiap hari ditulis otomatis dari berita terkini — baca, pahami, dan bagikan.</p>
    </section>

    <section class="feed-wrap">
      <div class="feed-label" id="feedLabel">Artikel terbaru</div>
      <div id="feed"><div class="loading"><div class="spinner"></div>Memuat artikel…</div></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Autoblog · digerakkan AI · <a href="https://ngopigame-blog.vercel.app">ngopigame-blog.vercel.app</a></p>
  </footer>

  <script>
    const feed = document.getElementById('feed');
    const pill = document.getElementById('countPill');
    const label = document.getElementById('feedLabel');

    function fmtDate(s) {
      try {
        return new Date(s.replace(' ', 'T')).toLocaleDateString('id-ID', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
      } catch (e) { return s; }
    }

    function renderList(posts) {
      if (!posts.length) {
        feed.innerHTML = '<div class="empty">Belum ada artikel — artikel pertama sedang disiapkan ✦</div>';
        pill.textContent = '0';
        return;
      }
      pill.textContent = posts.length + ' artikel';
      label.textContent = 'Artikel terbaru (' + posts.length + ')';
      feed.innerHTML = posts.map((p, i) => {
        const d = fmtDate(p.date);
        return '<a class="post" href="/posts/' + encodeURIComponent(p.slug) + '.html">' +
          '<div class="date">' + d + '</div>' +
          '<h2>' + p.title + '</h2>' +
          '<p class="excerpt">' + p.excerpt + '</p>' +
          '<span class="more">Baca artikel</span>' +
        '</a>';
      }).join('');
    }

    fetch('/posts.json?' + new Date().getTime())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(renderList)
      .catch(e => {
        feed.innerHTML = '<div class="empty">⚠️ Gagal memuat artikel.<br><small>' + e.message + '</small></div>';
        pill.textContent = '?';
      });
  </script>
</body>
</html>
